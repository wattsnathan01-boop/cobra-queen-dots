# ── COBRA QUEEN · hyprlock ───────────────────────
source = ~/.config/hypr/colors.conf

$font    = JetBrainsMono Nerd Font
$display = Orbitron

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/cobra-queen.png
    blur_passes = 0
}

# Dark veil over the left side so the text reads
shape {
    monitor =
    size = 900, 4000
    color = rgba(05080ad0)
    rounding = 0
    border_size = 0
    halign = left
    valign = center
    position = 0, 0
}

# Eyebrow
label {
    monitor =
    text = LOCKED · THE QUEEN IS WATCHING
    color = $hood
    font_size = 12
    font_family = $font
    halign = left
    valign = center
    position = 140, 250
}

# Clock
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text
    font_size = 140
    font_family = $display Black
    halign = left
    valign = center
    position = 130, 150
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(3bf0b655)
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 20
    font_family = $font
    halign = left
    valign = center
    position = 140, 40
}

# Avatar
image {
    monitor =
    path = ~/.config/hypr/wallpapers/cobra-avatar.png
    size = 64
    rounding = -1
    border_size = 2
    border_color = $venom $toxic $hood 45deg
    halign = left
    valign = center
    position = 140, -60
}

label {
    monitor =
    text = $USER
    color = $text
    font_size = 18
    font_family = $font Bold
    halign = left
    valign = center
    position = 222, -48
}

label {
    monitor =
    text = cmd[update:0] echo "$(hostname) · hyprland"
    color = $muted
    font_size = 11
    font_family = $font
    halign = left
    valign = center
    position = 222, -74
}

# Password
input-field {
    monitor =
    size = 440, 56
    outline_thickness = 2
    rounding = 14
    dots_size = 0.22
    dots_spacing = 0.45
    dots_center = false
    outer_color = $venom
    inner_color = rgba(0b1216cc)
    font_color = $text
    check_color = $toxic
    fail_color = $fang
    capslock_color = $hood
    fade_on_empty = false
    placeholder_text = <span foreground="##$mutedHex">  enter password</span>
    fail_text = <span foreground="##$hoodHex">$FAIL · $ATTEMPTS failed</span>
    font_family = $font
    halign = left
    valign = center
    position = 140, -150
}

# Status line
label {
    monitor =
    text = cmd[update:10000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo AC)%   󰖩 $(nmcli -t -f NAME connection show --active | head -n1)   󰎈 $(playerctl metadata title 2>/dev/null || echo silence)"
    color = $muted
    font_size = 11
    font_family = $font
    halign = left
    valign = bottom
    position = 140, 60
}

# Corner mark
label {
    monitor =
    text = 蛇
    color = rgba(3bf0b6aa)
    font_size = 32
    font_family = Noto Serif CJK JP
    halign = right
    valign = bottom
    position = -60, 40
}
