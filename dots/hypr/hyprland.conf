# ╔═══════════════════════════════════════════════╗
# ║   COBRA QUEEN · hyprland.conf                 ║
# ║   Written for Hyprland 0.53+ (new rule syntax)║
# ╚═══════════════════════════════════════════════╝

source = ~/.config/hypr/colors.conf

# ── Monitors ─────────────────────────────────────
# Alienware 15 panel: 1920x1200 @ 165Hz (check name with `hyprctl monitors`)
monitor = eDP-1, 1920x1200@165, 0x0, 1
# Anything else you plug in
monitor = , preferred, auto, 1

# ── Programs ─────────────────────────────────────
$terminal    = kitty
$fileManager = thunar
$browser     = google-chrome-stable
$menu        = rofi -show drun
$powermenu   = ~/.config/rofi/powermenu.sh

# ── Autostart ────────────────────────────────────
exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# Cobra assistant (github.com/wattsnathan01-boop/cobra-ai); needs Hyprland's env for hyprctl
exec-once = systemctl --user import-environment WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP && systemctl --user start cobra

# ── Environment ──────────────────────────────────
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# ── GPU: Intel iGPU + RTX 5060 (hybrid) ──────────
# The Intel iGPU drives the laptop panel, so the desktop runs on it
# (cool + quiet + good battery). Heavy apps go on the RTX 5060 with:
#     prime-run <app>          e.g. Steam launch options: prime-run %command%
# If you mostly use an external monitor on the HDMI/USB-C port (often wired
# to the NVIDIA GPU), uncomment these:
# env = LIBVA_DRIVER_NAME,nvidia
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct
# cursor {
#     no_hardware_cursors = true
# }

# ── Look & feel ──────────────────────────────────
general {
    gaps_in  = 6
    gaps_out = 14
    border_size = 2

    col.active_border   = $venom $toxic $hood 45deg
    col.inactive_border = rgba(1f3638aa)

    resize_on_border = true
    layout = dwindle
}

decoration {
    rounding = 12
    active_opacity   = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 24
        render_power = 3
        color = rgba(3bf0b626)
        color_inactive = rgba(00000066)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        vibrancy = 0.18
    }
}

# Strike: fast in, slight overshoot — like a cobra lunge
animations {
    enabled = true

    bezier = strike, 0.22, 1.2, 0.36, 1
    bezier = coil,   0.65, 0, 0.35, 1
    bezier = linear, 0, 0, 1, 1

    animation = windows,     1, 5, strike, popin 80%
    animation = windowsOut,  1, 4, coil,   popin 80%
    animation = border,      1, 8, coil
    animation = borderangle, 1, 60, linear, loop
    animation = fade,        1, 4, coil
    animation = layers,      1, 4, strike, slide
    animation = workspaces,  1, 5, strike, slidefade 15%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = $base
}

# ── Input ────────────────────────────────────────
input {
    kb_layout = gb
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ── Keybinds ─────────────────────────────────────
$mod = SUPER

bind = $mod, Return, exec, $terminal
bind = $mod, Space,  exec, $menu
bind = $mod, E,      exec, $fileManager
bind = $mod, B,      exec, $browser
bind = $mod, Q,      killactive
bind = $mod, F,      fullscreen
bind = $mod, V,      togglefloating
bind = $mod, P,      pseudo
bind = $mod, J,      togglesplit
bind = $mod, L,      exec, hyprlock
bind = $mod, Escape, exec, $powermenu
bind = $mod SHIFT, V, exec, cliphist list | rofi -dmenu -p clip | cliphist decode | wl-copy

# Screenshots
bind = , Print,       exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print,  exec, grim - | wl-copy

# Focus
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move windows
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces 1–6 (shown as 壱 弐 参 肆 伍 陸 in waybar)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Mouse move / resize
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Media & hardware keys
bindel = , XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,   exec, brightnessctl s 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-
bindl  = , XF86AudioPlay,  exec, playerctl play-pause
bindl  = , XF86AudioNext,  exec, playerctl next
bindl  = , XF86AudioPrev,  exec, playerctl previous

# ── Rules (0.53+ syntax) ─────────────────────────
windowrule = match:class ^(org.pulseaudio.pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(blueman-manager)$, float on
windowrule = match:title ^(Picture-in-Picture)$, float on, pin on

layerrule = match:namespace waybar, blur on, ignore_alpha 0.2
layerrule = match:namespace rofi, blur on, ignore_alpha 0.2
layerrule = match:namespace notifications, blur on, ignore_alpha 0.2
