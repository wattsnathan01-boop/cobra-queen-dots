# ── COBRA QUEEN · kitty ──────────────────────────

font_family      JetBrainsMono Nerd Font
font_size        12.0
disable_ligatures never

window_padding_width 22 26
background_opacity   0.88
confirm_os_window_close 0
enable_audio_bell no

cursor_shape      block
cursor_blink_interval 0.6
cursor_trail      3

tab_bar_style     powerline
tab_powerline_style slanted

# Palette
foreground            #e6f2ee
background            #07090b
selection_foreground  #03140f
selection_background  #3bf0b6
cursor                #3bf0b6
cursor_text_color     #03140f
url_color             #8a7bff

active_tab_foreground   #03140f
active_tab_background   #3bf0b6
inactive_tab_foreground #86a09a
inactive_tab_background #121b20

# black
color0  #07090b
color8  #1f3638
# red (crimson)
color1  #ff2d63
color9  #ff4d6d
# green (mint)
color2  #3bf0b6
color10 #7df7d0
# yellow
color3  #f5c26b
color11 #ffd58a
# blue
color4  #6c8cff
color12 #8fa8ff
# magenta (violet)
color5  #8a7bff
color13 #b3a8ff
# cyan (scale)
color6  #17a68c
color14 #3fd9c0
# white
color7  #c9dad5
color15 #e6f2ee

# Clipboard: ctrl+c copies when text is selected, otherwise interrupts
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
